[project]
name = "my_Agent"
version = "0.1.0"
description = "RAG Chatbot with an eval harness, built on free-tier LLMs"
requires-python = ">=3.10"
dependencies = [
    "numpy >= 1.26.0",
    "python-dotenv >= 1.0.0",
    "pypdf >= 4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]